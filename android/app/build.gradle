plugins { id 'com.android.application' }
android {
    namespace 'app.milepost'
    compileSdk 34
    defaultConfig {
        applicationId 'app.milepost'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    // A fixed, public DEBUG key so new test builds install over old ones. Not for store release.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
