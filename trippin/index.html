<div id="app">
  <main id="screens">
    <section class="screen" id="s-drive" data-screen="drive" aria-label="Drive"></section>
    <section class="screen" id="s-ahead" data-screen="ahead" aria-label="Ahead" hidden></section>
    <section class="screen" id="s-car" data-screen="car" aria-label="Car" hidden></section>
    <section class="screen" id="s-pilot" data-screen="pilot" aria-label="Co-pilot" hidden></section>
    <section class="screen" id="s-trip" data-screen="trip" aria-label="Trip" hidden></section>
  </main>

  <nav id="dock" aria-label="Main">
    <button data-go="drive" class="on"><svg class="i"><use href="#i-drive"/></svg><span>Drive</span></button>
    <button data-go="ahead"><svg class="i"><use href="#i-ahead"/></svg><span>Ahead</span></button>
    <button data-go="car"><svg class="i"><use href="#i-car"/></svg><span>Car</span><i class="badge" id="badge-car" hidden></i></button>
    <button data-go="pilot"><svg class="i"><use href="#i-pilot"/></svg><span>Pilot</span><i class="badge" id="badge-pilot" hidden></i></button>
    <button data-go="trip"><svg class="i"><use href="#i-trip"/></svg><span>Trip</span></button>
  </nav>

  <div id="hud" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
</div>
